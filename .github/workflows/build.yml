name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      # ------------------------------------
      # 1. 소스 받기
      # ------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------
      # 2. 파이썬
      # ------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ------------------------------------
      # 3. 시스템 패키지
      #    ubuntu-24.04 기준. libncurses5-dev 는 존재하지 않음
      # ------------------------------------
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-setuptools \
            autoconf automake libtool libltdl-dev \
            pkg-config zlib1g-dev libncurses-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            build-essential ccache patch

      # ------------------------------------
      # 4. buildozer  (버전 고정)
      # ------------------------------------
      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36 virtualenv

      # ------------------------------------
      # 5. SDK/NDK 캐시
      #    프로젝트 .buildozer 는 캐시하지 않음 (깨진 상태 재사용 방지)
      # ------------------------------------
      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # ------------------------------------
      # 6. 사전 점검
      # ------------------------------------
      - name: Sanity check
        run: |
          echo "--- tree ---"
          ls -R . | head -60
          echo "--- required files ---"
          for f in main.py buildozer.spec assets/Templat.png core/__init__.py; do
            if [ -f "$f" ]; then echo "OK      $f"; else echo "MISSING $f"; fi
          done
          echo "--- spec head ---"
          head -5 buildozer.spec

      # ------------------------------------
      # 7. 빌드
      #    set -o pipefail 없으면 tee 가 실패를 삼킴
      # ------------------------------------
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          yes | buildozer -v android debug 2>&1 | tee build.log

      # ------------------------------------
      # 8. 결과물
      # ------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ldr-apk
          path: bin/*.apk
          if-no-files-found: error

      # ------------------------------------
      # 9. 실패 시 로그  (always 로 두어 무조건 회수)
      # ------------------------------------
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn