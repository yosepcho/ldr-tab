
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NDK_VERSION: 25.2.9519653

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages and accept licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;${NDK_VERSION}"
          ls -al "$ANDROID_HOME"
          ls -al "$ANDROID_HOME/ndk"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential \
            ccache m4 patch

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade wheel setuptools
          pip install --upgrade "cython<3.0"
          pip install --upgrade buildozer

      - name: Point buildozer.spec at preinstalled SDK/NDK
        run: |
          NDK_PATH="$ANDROID_HOME/ndk/${NDK_VERSION}"

          # remove any existing (commented or active) path/version lines
          sed -i '/^[# ]*android\.sdk_path[ ]*=/d' buildozer.spec
          sed -i '/^[# ]*android\.ndk_path[ ]*=/d' buildozer.spec
          sed -i '/^[# ]*android\.ndk[ ]*=/d' buildozer.spec
          sed -i '/^[# ]*android\.api[ ]*=/d' buildozer.spec
          sed -i '/^[# ]*android\.minapi[ ]*=/d' buildozer.spec
          sed -i '/^[# ]*android\.accept_sdk_license[ ]*=/d' buildozer.spec

          # append authoritative values under [app]
          python - <<'PY'
          import os, re
          ndk = os.path.join(os.environ["ANDROID_HOME"], "ndk", os.environ["NDK_VERSION"])
          sdk = os.environ["ANDROID_HOME"]
          block = (
              f"\nandroid.sdk_path = {sdk}\n"
              f"android.ndk_path = {ndk}\n"
              f"android.ndk = {os.environ['NDK_VERSION']}\n"
              "android.api = 33\n"
              "android.minapi = 24\n"
              "android.accept_sdk_license = True\n"
          )
          text = open("buildozer.spec", encoding="utf-8").read()
          m = list(re.finditer(r"^\[buildozer\]", text, re.M))
          if m:
              i = m[0].start()
              text = text[:i] + block + "\n" + text[i:]
          else:
              text = text + block
          open("buildozer.spec", "w", encoding="utf-8").write(text)
          PY

          echo "----- buildozer.spec (android lines) -----"
          grep -n "^android\." buildozer.spec || true

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-bz-global-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: ${{ runner.os }}-bz-global-v2-

      - name: Build APK
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Tail build log on failure
        if: failure()
        run: tail -n 250 build.log || true

      - name: List output
        if: always()
        run: ls -al bin/ || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ldr-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
